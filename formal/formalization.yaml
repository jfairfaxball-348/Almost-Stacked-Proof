version: "v0.4"

project:
  name: "The critical Almost Stacked Hypothesis fails on a nine-vertex graph"
  description: >-
    In graph pebbling, a move removes two pebbles from a vertex and adds one to a
    neighbour; a configuration is stackable if moves can bring all pebbles onto one
    vertex and clearable if moves can leave exactly one pebble. The stacking (clearing)
    number of a connected (connected non-bipartite) graph is the least t >= 2 such that
    every configuration of t pebbles is stackable (clearable). The Almost Stacked
    Hypothesis, in its critical form, says that this number equals the least t0 >= 2
    such that every almost stacked configuration (one vertex arbitrary, every other
    vertex at most one pebble) of every size at least t0 is stackable (clearable). We
    formalise a counterexample to both clauses: on the nine-vertex graph G9 (graph6
    HCQTaXi) the stacking and clearing numbers are 15, the only non-stackable and
    non-clearable configurations of size 14 are (0,0,1,0,0,5,0,8,0) and its automorphic
    image, neither almost stacked, while every almost stacked configuration of size at
    least 14 is stackable and clearable. Hence neither clause holds for all finite
    connected (respectively connected non-bipartite) graphs. The finite facts are proved
    by kernel evaluation (decide +kernel) of a verified exact losing-layer checker on
    certificate data; general lemmas (clearable implies stackable; monotonicity above
    the order) are proved by hand.
  authors:
    - "John Fairfax-Ball"
  license: "Apache-2.0"
  responsible_maintainers:
    - "John Fairfax-Ball"

