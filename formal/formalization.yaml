fidelity:
  divergences: >-
    The critical (monotone) form of the hypothesis, reported by an author as the intended
    meaning, rather than the printed pointwise form. Definitions follow the source
    model (configurations as functions V -> N, moves along edges removing two pebbles and
    adding one); the universal statements quantify over graphs on Fin n.

review:
