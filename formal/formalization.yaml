  reviewers:
    - "none"
  notes: >-
    Independent fresh-session cold re-checks of the computation (STACK and CLEAR) and of
    the Lean statements against the specification; local lake comparator (statement and
    axiom check) and replays by Lean's kernel, nanoda, con-ron, lean4lean and
    leanchecker-paranoid. No human peer review.

