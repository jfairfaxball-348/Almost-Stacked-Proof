status:
  scope: >-
    Formalised: G9 is connected and not 2-colourable; for stacking and clearing, the
    exact size-14 loser characterisation, every size >= 15 winning, losers in every size
    2..14, stack(G9) = clear(G9) = 15, almost stacked thresholds 14, largest losing size
    14 and largest almost stacked losing size 13, failure of the critical hypothesis for
    G9 and hence of its universal form over all finite connected (resp. connected
    non-bipartite) graphs; clearable implies stackable; monotonicity above the order.
    Not formalised: the printed pointwise form of the hypothesis and its counterexamples;
    any positive result; a human proof of the non-stackability of the critical loser (the
    certificate proves it).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

