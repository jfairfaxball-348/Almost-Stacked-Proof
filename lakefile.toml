name = "almost_stacked"
version = "0.1.0"
defaultTargets = ["AlmostStacked", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

# Mathlib pinned to the exact commit tagged v4.35.0, whose lean-toolchain is the Lean
# release in `lean-toolchain` (Palomar requires an exact toolchain match and a release
# no older than the registry minimum, v4.35.0-rc2 when read on 2026-10-16).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "AlmostStacked"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
