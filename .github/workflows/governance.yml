name: Governance integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source/claim mirrors and phase statuses
        run: python3 validation/validate_governance.py
      - name: Re-check S003 printed-ASH counterexample certificates (independent replay/closure checker)
        run: for f in evidence/S003/cert_*.json; do python3 tools/cam_s003_cert.py check "$f"; done
      - name: Cold S004 printed audit, structural tests and AS independent-set witnesses
        run: |
          python3 tools/s004_cold.py --check-only
          python3 tools/s004_structure.py --check-only
          python3 tools/s004_witness_tests.py --check-only
      - name: Independent complete S004 frontier replay and full winning-base comparison
        run: |
          python3 tools/s004_verify_frontier.py --check-only
          python3 tools/s004_check_base.py --check-only
      - name: S006 exact rooted grammar, forests and complete bounded dual traversals
        run: |
          python3 tools/s006_verify.py --check-only
          python3 tools/s006_stack_verify.py --check-only
          python3 tools/s006_challenges.py --check-only
          python3 tools/s006_extrema.py --check-only
          python3 tools/s006_obstruction_verify.py --check-only
      - name: S007 independent full triangle-tail layers and legal constructive traces
        run: |
          python3 tools/s007_tail_verify.py --check-only
          python3 tools/s007_tail_verify.py --check-only --stack
      - name: S008 independent ancestry, universal symbolic inequalities and complete branch traces
        run: |
          python3 tools/s008_tip_verify.py --check-only
          python3 tools/s008_symbolic.py --check-only
          python3 tools/s008_branches_verify.py --check-only
      - name: S009 exact excursions, independent closures and protected triangle credit
        run: |
          python3 tools/s009_ports.py --check-only
          python3 tools/s009_ports_verify.py --check-only
          python3 tools/s009_credit.py --check-only
          python3 tools/s009_credit_verify.py --check-only
      - name: S010 independent exact counts, critical root compatibility and full marked reflection
        run: |
          python3 tools/s010_counts.py --check-only
          python3 tools/s010_counts_verify.py --check-only
          python3 tools/s010_roots.py --check-only
          python3 tools/s010_roots_verify.py --check-only
          python3 tools/s010_reflect.py --check-only
          python3 tools/s010_reflect_verify.py --check-only
      - name: S011 exact terminal transport, critical root types and CLEAR restrictions
        run: |
          python3 tools/s011_trees.py --check-only
          python3 tools/s011_trees_verify.py --check-only
          python3 tools/s011_transport.py --check-only
          python3 tools/s011_transport_verify.py --check-only
          python3 tools/s011_root_types.py --check-only
          python3 tools/s011_root_types_verify.py --check-only
      - name: S012 reciprocal input languages, original-root escape and actual donor exceptions
        run: |
          python3 tools/s012_reciprocity.py --check-only
          python3 tools/s012_reciprocity_verify.py --check-only
          python3 tools/s012_escape.py --check-only
          python3 tools/s012_escape_verify.py --check-only
          python3 tools/s012_exceptions.py --check-only
          python3 tools/s012_exceptions_verify.py --check-only
  s005-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Independent S005 complete losing-layer replay and winning-base check
        run: |
          g++ -O3 -std=c++17 tools/s005_stream_check.cpp -o /tmp/s005_stream_check
          python3 tools/s005_stream_verify.py --check-only --shard=${{ matrix.shard }}/4
      - name: S005 pure-pile theorem challenges and independent winning traces
        run: |
          python3 tools/s005_pure.py --check-only
          python3 tools/s005_check_traces.py
