name: Governance integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source/claim mirrors and phase statuses
        run: python3 validation/validate_governance.py
      - name: Re-check S003 printed-ASH counterexample certificates (independent replay/closure checker)
        run: for f in evidence/S003/cert_*.json; do python3 tools/cam_s003_cert.py check "$f"; done
      - name: Cold S004 printed audit, structural tests and AS independent-set witnesses
        run: |
          python3 tools/s004_cold.py --check-only
          python3 tools/s004_structure.py --check-only
          python3 tools/s004_witness_tests.py --check-only
      - name: Independent complete S004 frontier replay and full winning-base comparison
        run: |
          python3 tools/s004_verify_frontier.py --check-only
          python3 tools/s004_check_base.py --check-only
