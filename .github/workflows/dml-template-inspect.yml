name: DML official template inspection
on:
  push:
    paths: ['.github/workflows/dml-template-inspect.yml']
  pull_request:
    paths: ['.github/workflows/dml-template-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official ZIP and inspect LaTeX structure
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 60 'https://www.dmlett.com/archive/DML-Template.zip' -o dml.zip
          unzip -l dml.zip
          mkdir -p unpacked
          unzip -q dml.zip -d unpacked
          echo '=== TEXT FILES AND PREAMBLES ==='
          find unpacked -type f \( -name '*.tex' -o -name '*.sty' -o -name '*.cls' \) -print | sort | while IFS= read -r p; do
            echo "--- FILE: $p ---"
            sed -n '1,220p' "$p"
          done
          echo '=== DOWNLOAD_OK ==='
